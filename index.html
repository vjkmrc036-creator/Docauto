// ── Language detection helper ────────────────────────────────────────────────
function detectLanguage(text) {
  // Count Telugu Unicode chars (U+0C00–U+0C7F)
  const teluguCount = (text.match(/[ఀ-౿]/g)||[]).length;
  // Count Hindi/Devanagari (U+0900–U+097F)
  const hindiCount  = (text.match(/[ऀ-ॿ]/g)||[]).length;
  // Count Tamil (U+0B80–U+0BFF)
  const tamilCount  = (text.match(/[஀-௿]/g)||[]).length;
  // Count Kannada (U+0C80–U+0CFF)
  const kannadaCount= (text.match(/[ಀ-೿]/g)||[]).length;
  // Count Malayalam (U+0D00–U+0D7F)
  const malayalamCount=(text.match(/[ഀ-ൿ]/g)||[]).length;
  const nonEnglishTotal = teluguCount+hindiCount+tamilCount+kannadaCount+malayalamCount;
  // If more than 20 non-English chars → treat as regional language
  if(nonEnglishTotal > 20) {
    if(teluguCount >= hindiCount && teluguCount >= tamilCount) return {lang:"Telugu", useGemini:true};
    if(hindiCount > teluguCount) return {lang:"Hindi", useGemini:true};
    if(tamilCount > teluguCount) return {lang:"Tamil", useGemini:true};
    if(kannadaCount > 0) return {lang:"Kannada", useGemini:true};
    if(malayalamCount > 0) return {lang:"Malayalam", useGemini:true};
    return {lang:"Regional", useGemini:true};
  }
  return {lang:"English", useGemini:false};
}

// ── DOCX XML helpers ─────────────────────────────────────────────────────────
function decodeXmlEntities(s){
  return s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
          .replace(/&quot;/g,'"').replace(/&apos;/g,"'");
}
function encodeXmlEntities(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}

function extractTextFromXml(xml){
  let out="";
  const re=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g; let m;
  while((m=re.exec(xml))){ out += decodeXmlEntities(m[1]); }
  return out;
}

function extractParagraphsFromXml(xml){
  const paras = xml.split(/<w:p\b/).slice(1);
  const lines=[];
  for(const p of paras){
    const body = p.split(/<\/w:p>/)[0];
    let line=""; let m;
    const re=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g;
    while((m=re.exec(body))){ line += decodeXmlEntities(m[1]); }
    lines.push(line);
  }
  return lines.filter(l=>l.trim().length>0);
}

function healPlaceholders(xml){
  return xml.replace(/(<w:p\b[\s\S]*?<\/w:p>)/g, paragraph => {
    let fullText="";
    const tRe=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g; let m;
    while((m=tRe.exec(paragraph))){ fullText+=decodeXmlEntities(m[1]); }
    if(!/\{\{[A-Za-z0-9_]+\}\}/.test(fullText)) return paragraph;
    const runRe=/<w:r\b[^>]*>[\s\S]*?<\/w:r>/g;
    const runs=paragraph.match(runRe)||[];
    if(runs.length===0) return paragraph;
    const parsed = runs.map(r=>{
      const rprM=r.match(/<w:rPr>[\s\S]*?<\/w:rPr>/);
      const rPr = rprM?rprM[0]:"";
      let text=""; const tt=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g; let mm;
      while((mm=tt.exec(r))){ text+=decodeXmlEntities(mm[1]); }
      const hasText = /<w:t/.test(r);
      return {raw:r, text, rPr, hasText};
    });
    let result=""; let buffer=null;
    const flushBuffer=()=>{
      if(!buffer) return;
      if(buffer.raws.length===1){ result+=buffer.raws[0]; }
      else {
        const newRun = `<w:r>${buffer.rPr}<w:t xml:space="preserve">${encodeXmlEntities(buffer.text)}</w:t></w:r>`;
        result+=newRun;
      }
      buffer=null;
    };
    for(let i=0;i<parsed.length;i++){
      const cur=parsed[i];
      if(!cur.hasText){ flushBuffer(); result+=cur.raw; continue; }
      if(!buffer){ buffer={rPr:cur.rPr, text:cur.text, raws:[cur.raw]}; }
      else { buffer.text += cur.text; buffer.raws.push(cur.raw); }
      const openIdx = buffer.text.lastIndexOf("{{");
      const closeIdx = buffer.text.lastIndexOf("}}");
      const pendingOpen = openIdx > closeIdx;
      if(!pendingOpen){ flushBuffer(); }
    }
    flushBuffer();
    const firstIdx = paragraph.indexOf(runs[0]);
    const lastRun = runs[runs.length-1];
    const lastIdx = paragraph.lastIndexOf(lastRun) + lastRun.length;
    return paragraph.slice(0,firstIdx) + result + paragraph.slice(lastIdx);
  });
}

function fillPlaceholdersInXml(xml, values){
  const healed = healPlaceholders(xml);
  return healed.replace(/<w:t((?:\s[^>]*)?)>([\s\S]*?)<\/w:t>/g, (full, attrs, inner) => {
    let text = inner; let changed=false;
    text = text.replace(/\{\{([A-Za-z0-9_]+)\}\}/g, (mm,key)=>{
      changed=true;
      const v = values[key];
      return v!==undefined ? encodeXmlEntities(String(v)) : mm;
    });
    if(!changed) return full;
    const preserve = attrs.includes("xml:space") ? attrs : attrs+' xml:space="preserve"';
    return `<w:t${preserve}>${text}</w:t>`;
  });
}

function applyPlaceholderConversions(xml, replacements){
  let healed = healPlaceholders(xml);
  for(const {find,key} of (replacements||[])){
    if(!find || !find.trim()) continue;
    const escFind = find.trim();
    healed = healed.replace(/<w:t((?:\s[^>]*)?)>([\s\S]*?)<\/w:t>/g, (full, attrs, inner) => {
      const decoded = decodeXmlEntities(inner);
      if(!decoded.includes(escFind)) return full;
      const replaced = decoded.split(escFind).join(`{{${key}}}`);
      const preserve = attrs.includes("xml:space") ? attrs : attrs+' xml:space="preserve"';
      return `<w:t${preserve}>${encodeXmlEntities(replaced)}</w:t>`;
    });
  }
  return healed;
}

function findExistingPlaceholders(xml){
  const text = extractTextFromXml(xml);
  const set = new Set(); let m;
  const re=/\{\{([A-Za-z0-9_]+)\}\}/g;
  while((m=re.exec(text))) set.add(m[1]);
  return [...set];
}

async function loadDocx(file){
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const documentXml = await zip.file("word/document.xml").async("string");
  const headerFooterPaths = Object.keys(zip.files).filter(p=>/word\/(header|footer)\d*\.xml$/.test(p));
  return {zip, documentXml, headerFooterPaths};
}

async function buildDocxBlob(zip, documentXml, headerFooterXmls){
  zip.file("word/document.xml", documentXml);
  if(headerFooterXmls){
    for(const [path, content] of Object.entries(headerFooterXmls)){
      zip.file(path, content);
    }
  }
  return await zip.generateAsync({
    type:"blob",
    mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    // Ensure UTF-8 for Telugu and other Unicode content
  });
}

function downloadBlob(blob, filename){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

  const paragraphs = bodyText.split("\n").map(line=>{
    const t = line.length
      ? `<w:t xml:space="preserve">${esc(line)}</w:t>`
      : "";
    return `<w:p><w:r><w:rPr><w:rFonts w:ascii="Noto Sans Telugu" w:hAnsi="Noto Sans Telugu" w:cs="Noto Sans Telugu" w:hint="cs"/><w:lang w:val="te-IN" w:bidi="te-IN"/></w:rPr>${t}</w:r></w:p>`;
  }).join("");

  const titlePara = `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="32"/><w:szCs w:val="32"/><w:rFonts w:ascii="Noto Sans Telugu" w:hAnsi="Noto Sans Telugu" w:cs="Noto Sans Telugu" w:hint="cs"/><w:lang w:val="te-IN" w:bidi="te-IN"/></w:rPr><w:t xml:space="preserve">${esc(title+partLabel)}</w:t></w:r></w:p><w:p/>`;

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<w:body>
${titlePara}
${paragraphs}
<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1080" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>
</w:body>
</w:document>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const wordRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const zip = new JSZip();
  zip.file("[Content_Types].xml", contentTypes);
  zip.folder("_rels").file(".rels", rootRels);
  const wordFolder = zip.folder("word");
  wordFolder.file("document.xml", documentXml);
  wordFolder.file("styles.xml", stylesXml);
  wordFolder.folder("_rels").file("document.xml.rels", wordRels);
  return zip.generateAsync({
    type:"blob",
    mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  });
}

// ── IMPROVED: Split large docs into chunks for AI analysis ───────────────────
const CHUNK_SIZE = 8000;  // chars per chunk — larger to reduce chunk count & rate limit hits
const MAX_CHUNKS = 2;     // max 2 chunks (Groq free tier rate limit friendly)

// Sanitize document text before sending to AI — prevents JSON parse errors
function sanitizeTextForAI(text){
  // Sanitize text sent to AI in prompts — preserve Telugu Unicode, only fix ASCII issues
  return text
    .replace(/[\u201C\u201D\u201E\u201F]/g, '"')    // curly double quotes
    .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'") // curly single quotes
    .replace(/[\u2013\u2014]/g, "-")                   // em/en dash
    .replace(/[\u00A0\u00AD]/g, " ")                   // non-breaking/soft hyphen
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"") // ASCII control chars (keep \t\n\r)
    // NOTE: do NOT escape backslashes here — corrupts Telugu/Unicode text
    .trim();
}

// ── Telugu → Tanglish transliteration map ───────────────────────────────────
const TELUGU_MAP = [
  // Vowels
  ['అ','a'],['ఆ','aa'],['ఇ','i'],['ఈ','ee'],['ఉ','u'],['ఊ','oo'],
  ['ఎ','e'],['ఏ','ae'],['ఐ','ai'],['ఒ','o'],['ఓ','oo'],['ఔ','au'],
  // Consonants
  ['క','ka'],['ఖ','kha'],['గ','ga'],['ఘ','gha'],['చ','cha'],['జ','ja'],
  ['ట','ta'],['డ','da'],['త','tha'],['ద','dha'],['న','na'],['ప','pa'],
  ['ఫ','pha'],['బ','ba'],['భ','bha'],['మ','ma'],['య','ya'],['ర','ra'],
  ['ల','la'],['వ','va'],['శ','sha'],['ష','sha'],['స','sa'],['హ','ha'],
  ['ళ','la'],['ఱ','ra'],['క్ష','ksha'],['జ్ఞ','gna'],
  // Matras (vowel signs)
  ['ా','aa'],['ి','i'],['ీ','ee'],['ు','u'],['ూ','oo'],['ె','e'],
  ['ే','ae'],['ై','ai'],['ొ','o'],['ో','oo'],['ౌ','au'],['ం','m'],
  ['ః','h'],['్',''],['ఁ','n'],
  // Numbers
  ['౦','0'],['౧','1'],['౨','2'],['౩','3'],['౪','4'],
  ['౫','5'],['౬','6'],['౭','7'],['౮','8'],['౯','9'],
];

function teluguToTanglish(text){
  // Check if text has Telugu chars
  if(!/[ఀ-౿]/.test(text)) return text;
  let result = text;
  // Sort by length descending to match longer sequences first
  const sorted = [...TELUGU_MAP].sort((a,b)=>b[0].length-a[0].length);
  for(const [tel, eng] of sorted){
    result = result.split(tel).join(eng);
  }
  return result;
}

function splitIntoChunks(text, chunkSize){
  if(text.length <= chunkSize) return [text];
  const chunks = [];
  // Try to split on paragraph boundaries
  const paras = text.split(/\n\n+/);
  let current = "";
  for(const para of paras){
    if((current + "\n\n" + para).length > chunkSize && current.length > 0){
      chunks.push(current.trim());
      current = para;
    } else {
      current = current ? current + "\n\n" + para : para;
    }
  }
  if(current.trim()) chunks.push(current.trim());
  return chunks;
}

function mergeAiResults(results){
  const merged = { docTitle:"Document", language:"Auto", fields:[] };
  const seenKeys = new Set();
  for(const r of results){
    if(r.docTitle && r.docTitle !== "Document") merged.docTitle = r.docTitle;
    if(r.language && r.language !== "Auto") merged.language = r.language;
    for(const f of (r.fields||[])){
      if(!seenKeys.has(f.key)){
        seenKeys.add(f.key);
        merged.fields.push(f);
      }
    }
  }
  return merged;
}

// ── Convert Module ───────────────────────────────────────────────────────────
function Convert({groqKey, geminiKey, onDone}) {
  const [phase,setPhase]=useState("idle");
  const [log,setLog]=useState([]);
  const [result,setResult]=useState(null);
  const [err,setErr]=useState("");
  const [pasteText,setPasteText]=useState("");
  const fileRef=useRef();

  const addLog=msg=>setLog(p=>[...p,msg]);

  // ── Build prompt ─────────────────────────────────────────────────────────
  const buildPrompt = (text, mode, existingPlaceholders) => {
    if(mode==="docx"){
      return `You are a document automation expert working with extracted text from an Indian legal/government Word document (.docx).
Existing placeholders already found: ${JSON.stringify(existingPlaceholders||[])}

TASK: Find every hardcoded variable value (names, dates, ages, Aadhaar/PAN/IDs, amounts, addresses, survey numbers, districts, mandals, etc.) NOT already a {{...}} placeholder, and propose converting each to a {{UPPER_SNAKE_CASE}} placeholder.

Return ONLY raw JSON, no markdown, no code fences. Escape all backslashes and quotes inside string values:
{"docTitle":"Document Type","language":"English or Telugu etc","fields":[{"key":"FIELD_KEY","label":"Human readable label","type":"text|date|number|id|address|currency","required":true,"sample":"EXACT literal text found","find":"EXACT substring to search-and-replace"}]}

Rules:
- "find" must match EXACTLY as it appears in the document text
- Do NOT include fields for already-existing {{...}} placeholders
- UPPERCASE_SNAKE_CASE for "key"
- Each name/date/ID/amount/address = separate field
- If no new hardcoded values found, return {"docTitle":"...","language":"...","fields":[]}

DOCUMENT TEXT:
${text}`;
    } else {
      return `You are a document automation expert. Analyze this Indian legal/government document text and identify ALL variable fields (names, dates, IDs, amounts, addresses).

Return ONLY raw JSON (no markdown, no code fences, no trailing text).
CRITICAL: Escape all backslashes and internal quotes in string values. No raw newlines inside strings.
{"templateText":"document text with {{PLACEHOLDER_KEY}} substitutions","fields":[{"key":"PLACEHOLDER_KEY","label":"Human readable label","type":"text|date|number|id|address|currency","required":true,"sample":"original value"}],"docTitle":"Document Type","language":"English or Telugu etc"}

Rules:
- UPPERCASE_SNAKE_CASE keys
- Every name, date, amount, ID number, address = a separate field
- Keep standard/legal boilerplate text unchanged
- templateText must have ALL variables replaced with {{KEY}} tags

DOCUMENT:
${text}`;
    }
  };

  // ── Call Gemini API — try ONCE, instantly fall back to Groq on any error ────
  const callGemini = async(text, mode, existingPlaceholders) => {
    addLog(`🌐 Gemini API — single-shot (large doc support)...`);
    const prompt = buildPrompt(text, mode, existingPlaceholders);
    try {
      const r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${geminiKey}`,
        { method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({
            contents:[{parts:[{text: prompt}]}],
            generationConfig:{maxOutputTokens:8192, temperature:0.1}
          })
        }
      );
      if(r.status===429){
        addLog(`⚠️ Gemini quota exceeded — instantly switching to Groq...`);
        return null;
      }
      if(!r.ok){
        let msg="";
        try{ const e=await r.json(); msg=e?.error?.message||""; }catch{}
        if(r.status===400 && msg.includes("API_KEY")) throw new Error("Invalid Gemini API key.");
        addLog(`⚠️ Gemini error ${r.status} — switching to Groq...`);
        return null;
      }
      const d = await r.json();
      const raw = d?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      return raw;
    } catch(fetchErr){
      if(fetchErr.message && fetchErr.message.includes("API key")) throw fetchErr;
      addLog(`⚠️ Gemini unreachable — switching to Groq...`);
      return null;
    }
  };

  // ── Call Groq API chunk (with retry) ──────────────────────────────────────
  const callGroqChunk = async(text, mode, existingPlaceholders, chunkIdx, totalChunks) => {
    const chunkLabel = totalChunks > 1 ? ` (chunk ${chunkIdx+1}/${totalChunks})` : "";
    addLog(`⚡ Groq analyzing${chunkLabel}...`);
    const prompt = buildPrompt(text, mode, existingPlaceholders);
    let d;
    for(let attempt=0; attempt<4; attempt++){
      const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+groqKey},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:3000,messages:[{role:"user",content:prompt}]})
      });
      if(r.status===429){
        const retryAfter = parseInt(r.headers.get("retry-after")||"0",10);
        const wait = retryAfter>0 ? retryAfter*1000 : (attempt===0?10000:attempt===1?30000:60000);
        addLog(`⏳ Groq rate limit — waiting ${Math.round(wait/1000)}s (retry ${attempt+1}/3)...`);
        await new Promise(res=>setTimeout(res,wait));
        continue;
      }
      if(!r.ok){
        if(r.status===413) throw new Error("Chunk too large (413). Try a shorter document.");
        if(r.status===401) throw new Error("Invalid Groq API key (401).");
        let bodyMsg="";
        try{ const eb=await r.json(); bodyMsg=eb?.error?.message||""; }catch{}
        throw new Error(`Groq API error ${r.status}${bodyMsg?": "+bodyMsg:""}`);
      }
      d=await r.json();
      break;
    }
    if(!d) throw new Error("Groq rate limit exceeded after 3 retries. Please wait a minute.");
    const raw=d.choices?.[0]?.message?.content||"";
    return raw;
  };
  // (parsing moved to parseAIResponse)

  // ── Parse raw AI text response → structured JSON ─────────────────────────
  const parseAIResponse = (raw) => {
    const tryParse = (s) => { try { return JSON.parse(s); } catch(e) { return null; } };
    let jsonStr = raw.replace(/```json\s*([\s\S]*?)```/g,"$1").replace(/```\s*([\s\S]*?)```/g,"$1").trim();
    const startIdx = jsonStr.indexOf('{');
    const endIdx = jsonStr.lastIndexOf('}');
    if(startIdx !== -1 && endIdx !== -1) jsonStr = jsonStr.slice(startIdx, endIdx+1);
    jsonStr = jsonStr
      .replace(/[\u201C\u201D\u201E\u201F]/g, '\\"')
      .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")
      .replace(/[\u2013\u2014]/g, "-")
      .replace(/[\u00A0\u00AD]/g, " ")
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");
    jsonStr = jsonStr.replace(/"((?:[^"\\]|\\.)*)"/g, (m, inner) => {
      const fixed = inner.replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/\r/g,"\\r").replace(/\t/g,"\\t");
      const unDoubled = fixed.replace(/\\\\(["\\/bfnrtu])/g,"\\$1");
      return '"' + unDoubled + '"';
    });
    let parsed = tryParse(jsonStr);
    if(!parsed){
      let cutAt = -1;
      ['"required":true}', '"required":false}', '"find":""}', '"sample":""}'].forEach(pat => {
        const idx = jsonStr.lastIndexOf(pat);
        if(idx > cutAt) cutAt = idx + pat.length - 1;
      });
      if(cutAt > startIdx) parsed = tryParse(jsonStr.slice(0,cutAt+1)+']}');
      if(!parsed) parsed = tryParse(jsonStr.trimEnd()+']}');
      if(!parsed) parsed = tryParse(jsonStr.trimEnd()+'"]}');
    }
    if(!parsed){
      try{
        const docTitleM=raw.match(/"docTitle"\s*:\s*"([^"\\]*)"/);
        const languageM=raw.match(/"language"\s*:\s*"([^"\\]*)"/);
        const fieldsRaw=[];
        const fieldRe=/\{\s*"key"\s*:\s*"([^"]+)"[\s\S]*?"label"\s*:\s*"([^"]*)"[\s\S]*?"type"\s*:\s*"([^"]*)"[\s\S]*?"required"\s*:\s*(true|false)/g;
        let fm;
        while((fm=fieldRe.exec(raw))!==null){
          const sampleM=raw.slice(fm.index).match(/"sample"\s*:\s*"([^"]*)"/);
          const findM=raw.slice(fm.index).match(/"find"\s*:\s*"([^"]*)"/);
          fieldsRaw.push({key:fm[1],label:fm[2],type:fm[3],required:fm[4]==="true",
            sample:sampleM?sampleM[1]:"",find:findM?findM[1]:""});
        }
        if(fieldsRaw.length>0||docTitleM){
          parsed={docTitle:docTitleM?docTitleM[1]:"Document",language:languageM?languageM[1]:"Auto",fields:fieldsRaw};
          addLog(`⚠️ Used fallback extractor: ${fieldsRaw.length} fields`);
        }
      }catch(fe){}
    }
    if(!parsed) throw new Error("Could not parse AI response as JSON. Please try again.");
    if(parsed.fields && Array.isArray(parsed.fields)){
      parsed.fields=parsed.fields.map(f=>{
        const k=f.key||f.field_key||f.name||f.fieldName||f.placeholder||
          (f.label||f.fieldLabel||f.field_name||"FIELD").toUpperCase().replace(/[^A-Z0-9]+/g,"_");
        return {key:k,label:f.label||f.fieldLabel||f.field_label||f.description||f.field_name||k,
          type:f.type||f.fieldType||"text",required:f.required!==undefined?f.required:true,
          sample:f.sample||f.example||f.value||f.original_value||"",
          find:f.find||f.sample||f.example||""};
      });
    }
    return parsed;
  };

  // ── callAIChunk: Groq only, used for English chunked processing ───────────
  const callAIChunk = async(text, mode, existingPlaceholders, chunkIdx, totalChunks) => {
    const raw = await callGroqChunk(text, mode, existingPlaceholders, chunkIdx, totalChunks);
    const parsed = parseAIResponse(raw);
    addLog(`✅ Chunk ${chunkIdx+1}: found ${parsed.fields?.length||0} fields`);
    return parsed;
  };

  // ── Main dispatcher: auto-route to Groq (English) or Gemini (regional) ───
  const callAI = async(fullText, mode, existingPlaceholders) => {
    const {lang, useGemini} = detectLanguage(fullText);

    // Use Gemini for regional languages
    // Gemini 2.0-flash supports 1M tokens — chunk only if very large (>30000 chars)
    if(useGemini && geminiKey){
      const GEMINI_CHUNK = 30000;
      if(fullText.length <= GEMINI_CHUNK){
        addLog(`🔍 Detected: ${lang} → Gemini single-shot`);
        addLog(`📊 Document: ${fullText.length} chars — sending in full`);
        const cleanText = sanitizeTextForAI(fullText);
        const raw = await callGemini(cleanText, mode, existingPlaceholders);
        if(raw !== null){
          const parsed = parseAIResponse(raw);
          addLog(`✅ Gemini found ${parsed.fields?.length||0} fields`);
          return parsed;
        }
        // Gemini quota exhausted → fall through to Groq below
      } else {
        // Large doc — 2 Gemini chunks
        const chunks = splitIntoChunks(fullText, GEMINI_CHUNK);
        const numChunks = Math.min(chunks.length, 2);
        addLog(`🔍 Detected: ${lang} → Gemini ${numChunks} chunks`);
        const results = [];
        let geminiOk = true;
        for(let i=0; i<numChunks; i++){
          addLog(`🌐 Gemini chunk ${i+1}/${numChunks}...`);
          const cleanChunk = sanitizeTextForAI(chunks[i]);
          const raw = await callGemini(cleanChunk, mode, existingPlaceholders);
          if(raw === null){ geminiOk = false; break; }
          results.push(parseAIResponse(raw));
          if(i < numChunks-1) await new Promise(r=>setTimeout(r,5000));
        }
        if(geminiOk && results.length > 0){
          const merged = mergeAiResults(results);
          addLog(`✅ Gemini merged: ${merged.fields.length} fields`);
          return merged;
        }
        // Fall through to Groq
      }
      addLog(`🔄 Gemini unavailable — using Groq as fallback (Telugu via Groq)`);
    }

    // No Gemini or Gemini failed — use Groq with transliteration pre-processing
    if(useGemini && !geminiKey){
      addLog(`⚠️ No Gemini key — using Groq for ${lang}`);
    } else if(useGemini){
      addLog(`🔄 Gemini unavailable — switching to Groq for ${lang}`);
    } else {
      addLog(`🔍 Detected: ${lang} → Groq`);
    }

    // Groq: convert Telugu→Tanglish first (reduces tokens, improves JSON output)
    const groqText = useGemini ? teluguToTanglish(fullText) : fullText;
    if(useGemini && groqText !== fullText){
      addLog(`🔤 Telugu→Tanglish conversion for Groq (saves tokens)`);
    }
    const chunks = splitIntoChunks(groqText, CHUNK_SIZE);
    const numChunks = Math.min(chunks.length, MAX_CHUNKS);
    addLog(`📊 Document: ${groqText.length} chars → ${chunks.length} chunks (analyzing ${numChunks})`);
    const results = [];
    for(let i=0; i<numChunks; i++){
      const cleanChunk = sanitizeTextForAI(chunks[i]);
      const chunkResult = await callAIChunk(cleanChunk, mode, existingPlaceholders, i, numChunks);
      results.push(chunkResult);
      if(i < numChunks-1) await new Promise(res=>setTimeout(res,5000));
    }
    const merged = mergeAiResults(results);
    addLog(`🔀 Merged: ${merged.fields.length} total fields from ${numChunks} chunks`);
    return merged;
  };

  // Process plain text → text template
  const process=async(text,fname="pasted text")=>{
    setPhase("reading");setLog([]);setErr("");
    addLog(`📄 Reading ${fname}...`);
    try{
      addLog(`✅ ${text.length} characters`);
      const parsed=await callAI(text,"text");
      addLog(`✅ Found ${parsed.fields?.length||0} fields total`);
      addLog("🎉 Done!");
      setResult({mode:"text", ...parsed});setPhase("done");
    }catch(e){setErr(e.message);setPhase("error");}
  };

  // Process .docx → Smart Template mode
  const processDocx = async(file)=>{
    setPhase("reading");setLog([]);setErr("");
    addLog(`📄 Reading ${file.name}...`);
    try{
      const {zip, documentXml, headerFooterPaths} = await loadDocx(file);
      const existing = findExistingPlaceholders(documentXml);
      addLog(`🔎 Found ${existing.length} existing {{placeholders}}`);
      const lines = extractParagraphsFromXml(documentXml);
      const plainText = lines.join("\n");
      addLog(`✅ Extracted ${plainText.length} characters`);

      let aiResult={docTitle:"Document",language:"Auto",fields:[]};
      if(plainText.trim().length>0){
        try{
          aiResult = await callAI(plainText,"docx",existing);
        }catch(e){
          addLog("⚠️ AI analysis failed: "+e.message+" (continuing with existing placeholders)");
        }
      }

      const aiFieldsByKey={};
      (aiResult.fields||[]).forEach(f=>{aiFieldsByKey[f.key]=f;});
      const existingFields = existing.map(key=>({
        key, label: key.replace(/_/g," "), type:"text", required:true, sample:"", find:"", existing:true
      }));
      const newFields = (aiResult.fields||[]).filter(f=>!existing.includes(f.key)).map(f=>({...f, existing:false}));
      addLog(`✅ ${existingFields.length} existing + ${newFields.length} new suggested fields`);
      addLog("🎉 Done!");
      setResult({
        mode:"docx",
        docTitle: aiResult.docTitle || file.name.replace(/\.docx$/i,""),
        language: aiResult.language || "Auto",
        fileName: file.name,
        zip, documentXml, headerFooterPaths,
        existingFields, newFields,
        selectedNew: newFields.map(()=>true),
      });
      setPhase("done");
    }catch(e){ setErr(e.message);setPhase("error"); }
  };

  const onFile=e=>{
    const f=e.target.files?.[0];if(!f)return;
    const name=f.name.toLowerCase();
    if(name.endsWith(".docx")){ processDocx(f); }
    else if(name.endsWith(".txt")||name.endsWith(".md")||name.endsWith(".html")){
      const rd=new FileReader();
      rd.onload=ev=>process(ev.target.result,f.name);
      rd.readAsText(f);
    }else{setPhase("paste");}
  };

  const onDrop=e=>{
    e.preventDefault();e.currentTarget.style.borderColor="#CBD5E1";
    const f=e.dataTransfer.files[0];if(!f)return;
    const name=f.name.toLowerCase();
    if(name.endsWith(".docx")){processDocx(f);return;}
    const rd=new FileReader();rd.onload=ev=>process(ev.target.result,f.name);rd.readAsText(f);
  };

  const TC={text:C.indigo,date:C.teal,number:C.gold,id:C.rose,address:C.slate,currency:C.green};

  if(phase==="idle") return(
    <div className="fadein">
      <Heading title="Convert Document → Fillable Template"
        sub="English → Groq (chunked) · Telugu/Hindi/Tamil → Gemini (single-shot). Upload DOCX or paste text."/>
      <Card>
        <div onClick={()=>fileRef.current.click()}
          style={{border:"2px dashed #CBD5E1",borderRadius:12,padding:"36px 16px",textAlign:"center",background:C.bg,cursor:"pointer"}}
          onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor=C.indigo;}}
          onDragLeave={e=>{e.currentTarget.style.borderColor="#CBD5E1";}}
          onDrop={onDrop}>
          <div style={{fontSize:44}}>📄</div>
          <p style={{fontWeight:700,margin:"10px 0 4px",color:C.text}}>Drop file or tap to browse</p>
          <p style={{color:C.muted,fontSize:12}}>DOCX (Smart Template) · TXT · MD · HTML</p>
          <p style={{color:C.teal,fontSize:11,marginTop:4}}>📦 Large files: auto-split into chunks for full analysis</p>
          <input ref={fileRef} type="file" accept=".txt,.md,.html,.docx" style={{display:"none"}} onChange={onFile}/>
        </div>
        <div style={{margin:"20px 0 8px",fontWeight:700,fontSize:13,color:C.text}}>✏️ Or paste document text:</div>
        <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)}
          placeholder="Paste your document here (Telugu, English, Hindi — any language)..."
          style={{width:"100%",minHeight:130,padding:12,border:"2px solid #E2E8F0",borderRadius:10,
            fontSize:13,lineHeight:1.7,resize:"vertical",outline:"none",color:C.text}}/>
        <div style={{marginTop:8,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <Btn color={C.indigo} disabled={!pasteText.trim()} onClick={()=>process(pasteText)}>
            🔄 Convert to Text Template
          </Btn>
          {pasteText.length>3000 && (()=>{
            const {lang,useGemini}=detectLanguage(pasteText);
            return useGemini && geminiKey
              ? <Badge color={C.teal}>🌐 {lang} → Gemini single-shot ({pasteText.length} chars)</Badge>
              : <Badge color={C.amber}>⚡ Long doc: {pasteText.length} chars → {Math.min(splitIntoChunks(pasteText,CHUNK_SIZE).length,MAX_CHUNKS)} Groq chunks</Badge>;
          })()}
        </div>
        <div style={{marginTop:20}}>
          <p style={{fontSize:12,color:C.muted,fontWeight:600,marginBottom:8}}>Try a sample:</p>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {SAMPLES.map(s=>(
              <button key={s.name} onClick={()=>process(s.text,s.name)}
                style={{padding:"5px 12px",border:`1px solid ${C.indigo}40`,borderRadius:20,
                  background:C.indigo+"10",color:C.indigo,fontSize:12,fontWeight:600,cursor:"pointer"}}>
                {s.name}
              </button>
            ))}
          </div>
        </div>
      </Card>
    </div>
  );

  if(phase==="reading"||phase==="ai") return(
    <Card style={{textAlign:"center",padding:48}}>
      <div style={{fontSize:52,display:"inline-block",animation:"spin 1s linear infinite"}}>
        {phase==="reading"?"📖":"🧠"}
      </div>
      <p style={{fontWeight:800,fontSize:17,margin:"14px 0 4px",color:C.text}}>
        {phase==="reading"?"Reading Document…":"AI Analyzing (chunked)…"}
      </p>
      <div style={{display:"flex",flexDirection:"column",gap:6,maxWidth:360,margin:"16px auto 0",textAlign:"left"}}>
        {log.map((l,i)=>(
          <div key={i} style={{fontSize:12,color:C.indigo,background:C.indigo+"10",padding:"5px 10px",borderRadius:7}}>{l}</div>
        ))}
      </div>
    </Card>
  );

  if(phase==="paste") return(
    <div className="fadein">
      <Heading title="Paste Document Content" sub="This file type can't be read directly — paste the text below."/>
      <Card>
        <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)}
          placeholder="Paste document text here..."
          style={{width:"100%",minHeight:220,padding:12,border:"2px solid #E2E8F0",borderRadius:10,fontSize:13,outline:"none",color:C.text,resize:"vertical"}}/>
        <div style={{marginTop:10,display:"flex",gap:8}}>
          <Btn color={C.indigo} disabled={!pasteText.trim()} onClick={()=>process(pasteText)}>Convert</Btn>
          <Btn outline color={C.slate} onClick={()=>setPhase("idle")}>← Back</Btn>
        </div>
      </Card>
    </div>
  );

  if(phase==="error") return(
    <Card style={{textAlign:"center",padding:40,border:`2px solid ${C.rose}40`}}>
      <div style={{fontSize:44}}>⚠️</div>
      <p style={{fontWeight:800,color:C.rose,margin:"12px 0 4px"}}>Conversion Failed</p>
      <p style={{color:C.muted,fontSize:13,marginBottom:20}}>{err}</p>
      <Btn color={C.indigo} onClick={()=>{setPhase("idle");setErr("");}}>Try Again</Btn>
    </Card>
  );

  if(phase==="done"&&result&&result.mode==="text") return(
    <div className="fadein">
      <Heading title="✅ Conversion Complete!"
        sub={`${result.docTitle||"Document"} · ${result.language||""} · ${result.fields?.length||0} fields found`}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10,marginBottom:16}}>
        {[["Fields",result.fields?.length||0,C.indigo,"🔍"],
          ["Required",result.fields?.filter(f=>f.required).length||0,C.rose,"⚠️"],
          ["Type",result.docTitle||"Doc",C.teal,"📄"],
          ["Language",result.language||"Auto",C.gold,"🌐"]
        ].map(([l,v,c,i])=>(
          <Card key={l} style={{textAlign:"center",padding:14}}>
            <div style={{fontSize:22}}>{i}</div>
            <div style={{fontSize:20,fontWeight:900,color:c,margin:"2px 0"}}>{v}</div>
            <div style={{fontSize:11,color:C.muted}}>{l}</div>
          </Card>
        ))}
      </div>
      <Card style={{marginBottom:14}}>
        <h4 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,color:C.text}}>📋 Detected Fields</h4>
        <div style={{display:"flex",flexDirection:"column",gap:7,maxHeight:300,overflowY:"auto"}}>
          {(result.fields||[]).map((f,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",
              background:f.required?C.rose+"06":C.bg,border:`1px solid ${f.required?C.rose+"30":"#E2E8F0"}`,borderRadius:9}}>
              <code style={{fontSize:11,color:C.indigo,background:C.indigo+"12",padding:"2px 7px",borderRadius:5}}>{`{{${f.key||"FIELD"}}}`}</code>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13}}>{f.label||f.key}</div>
                {f.sample&&<div style={{fontSize:11,color:C.muted}}>e.g. {f.sample}</div>}
              </div>
              <Badge color={TC[f.type]||C.slate}>{f.type||"text"}</Badge>
            </div>
          ))}
        </div>
      </Card>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn color={C.indigo} onClick={()=>onDone(result)} icon="✍️">Fill This Template</Btn>
        <Btn outline color={C.slate} onClick={()=>{setPhase("idle");setResult(null);setLog([]);}}>Convert Another</Btn>
      </div>
    </div>
  );

  if(phase==="done"&&result&&result.mode==="docx") return(
    <DocxConvertReview result={result} setResult={setResult} onDone={onDone}
      onReset={()=>{setPhase("idle");setResult(null);setLog([]);}}/>
  );

  return null;
}

// ── DOCX Convert Review ──────────────────────────────────────────────────────
function DocxConvertReview({result, setResult, onDone, onReset}){
  const TC={text:C.indigo,date:C.teal,number:C.gold,id:C.rose,address:C.slate,currency:C.green};
  const toggle=i=>{
    setResult(r=>{const sel=[...r.selectedNew];sel[i]=!sel[i];return {...r,selectedNew:sel};});
  };
  const editField=(i,key,val)=>{
    setResult(r=>{const nf=[...r.newFields];nf[i]={...nf[i],[key]:val};return {...r,newFields:nf};});
  };
  const proceed=()=>{
    const chosen = result.newFields.filter((f,i)=>result.selectedNew[i]);
    let xml = result.documentXml;
    if(chosen.length){ xml = applyPlaceholderConversions(xml, chosen.map(f=>({find:f.find,key:f.key}))); }
    else { xml = healPlaceholders(xml); }
    const allFields = [
      ...result.existingFields,
      ...chosen.map(f=>({key:f.key,label:f.label,type:f.type,required:f.required,sample:f.sample}))
    ];
    onDone({mode:"docx",docTitle:result.docTitle,language:result.language,fileName:result.fileName,
      zip:result.zip,documentXml:xml,headerFooterPaths:result.headerFooterPaths,fields:allFields});
  };
  const total = result.existingFields.length + result.newFields.filter((f,i)=>result.selectedNew[i]).length;
  return(
    <div className="fadein">
      <Heading title="✅ Smart Template Analysis Complete!"
        sub={`${result.docTitle} · ${result.language} · ${result.fileName}`}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10,marginBottom:16}}>
        {[["Existing tags",result.existingFields.length,C.teal,"🏷️"],
          ["New suggested",result.newFields.length,C.indigo,"✨"],
          ["Will be filled",total,C.green,"✅"],
          ["Format","Preserved",C.gold,"🖋️"]
        ].map(([l,v,c,i])=>(
          <Card key={l} style={{textAlign:"center",padding:14}}>
            <div style={{fontSize:22}}>{i}</div>
            <div style={{fontSize:20,fontWeight:900,color:c,margin:"2px 0"}}>{v}</div>
            <div style={{fontSize:11,color:C.muted}}>{l}</div>
          </Card>
        ))}
      </div>
      {result.existingFields.length>0&&(
        <Card style={{marginBottom:14}}>
          <h4 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,color:C.text}}>🏷️ Existing Placeholders Found</h4>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {result.existingFields.map(f=>(
              <code key={f.key} style={{fontSize:11,color:C.teal,background:C.teal+"12",padding:"4px 9px",borderRadius:6}}>{`{{${f.key}}}`}</code>
            ))}
          </div>
        </Card>
      )}
      {result.newFields.length>0?(
        <Card style={{marginBottom:14}}>
          <h4 style={{margin:"0 0 4px",fontSize:14,fontWeight:700,color:C.text}}>✨ New Hardcoded Values → Suggested Placeholders</h4>
          <p style={{margin:"0 0 12px",fontSize:12,color:C.muted}}>Uncheck any you don't want converted.</p>
          <div style={{display:"flex",flexDirection:"column",gap:7,maxHeight:380,overflowY:"auto"}}>
            {result.newFields.map((f,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",
                background:result.selectedNew[i]?C.bg:"#F8F8F8",border:`1px solid ${result.selectedNew[i]?"#E2E8F0":"#EEE"}`,borderRadius:9,opacity:result.selectedNew[i]?1:0.55}}>
                <input type="checkbox" checked={result.selectedNew[i]} onChange={()=>toggle(i)} style={{width:16,height:16,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                    <code style={{fontSize:11,color:C.indigo,background:C.indigo+"12",padding:"2px 7px",borderRadius:5}}>{`{{${f.key}}}`}</code>
                    <span style={{fontWeight:600,fontSize:13}}>{f.label}</span>
                    <Badge color={TC[f.type]||C.slate}>{f.type||"text"}</Badge>
                  </div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2,wordBreak:"break-all"}}>
                    Replaces: "<strong>{f.find||f.sample}</strong>"
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>
      ):(
        <Card style={{marginBottom:14,background:C.green+"08",border:`1px solid ${C.green}30`}}>
          <p style={{margin:0,fontSize:13,color:C.green,fontWeight:700}}>✅ Document already fully templated — no new hardcoded values detected.</p>
        </Card>
      )}
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn color={C.indigo} onClick={proceed} icon="✍️">Fill This Template ({total} fields)</Btn>
        <Btn outline color={C.slate} onClick={onReset}>Convert Another</Btn>
      </div>
    </div>
  );
}

// ── IMPROVED Fill & Generate ─────────────────────────────────────────────────
// Splits output DOCX into 2 parts if content is very large
const SPLIT_LINE_THRESHOLD = 500;   // lines before splitting
const SPLIT_CHAR_THRESHOLD = 40000; // chars before splitting

function Fill({template, addRecord}) {
  const tpl=template||DEFAULT_TPL;
  const isDocx = tpl.mode==="docx";
  const fields = tpl.fields||[];

  const [vals,setVals]=useState(()=>{
    const o={};(fields||[]).forEach(f=>{o[f.key]=f.sample||"";});return o;
  });
  const [errs,setErrs]=useState({});
  const [done,setDone]=useState(false);
  const [doc,setDoc]=useState("");
  const [docxBlob,setDocxBlob]=useState(null);
  const [docxBlob2,setDocxBlob2]=useState(null); // Part 2 if split
  const [generating,setGenerating]=useState(false);
  const [genStatus,setGenStatus]=useState("");

  useEffect(()=>{
    const o={};(fields||[]).forEach(f=>{o[f.key]=f.sample||"";});
    setVals(o);setDone(false);setErrs({});setDocxBlob(null);setDocxBlob2(null);
  },[template]);

  const TC={text:C.indigo,date:C.teal,number:C.gold,id:C.rose,address:C.slate,currency:C.green};
  const TI={text:"📝",date:"📅",number:"🔢",id:"🪪",address:"🏠",currency:"💰"};

  const groups={};
  (fields||[]).forEach(f=>{
    const g=f.type==="id"?"🪪 Identity":f.type==="date"?"📅 Dates":
      (f.type==="currency"||f.type==="number")?"💰 Amounts":
      f.type==="address"?"🏠 Address":"📝 Text Fields";
    if(!groups[g])groups[g]=[];groups[g].push(f);
  });
  const GC={"🪪 Identity":C.rose,"📅 Dates":C.teal,"💰 Amounts":C.gold,"🏠 Address":C.slate,"📝 Text Fields":C.indigo};

  const validate=()=>{
    const e={};
    (fields||[]).filter(f=>f.required).forEach(f=>{if(!vals[f.key]?.trim())e[f.key]="Required";});
    setErrs(e);
    return Object.keys(e).length===0;
  };

  const generate=async()=>{
    if(!validate())return;
    setGenerating(true);setGenStatus("Generating document...");
    try{
      if(isDocx){
        setGenStatus("Filling placeholders...");
        const filledXml = fillPlaceholdersInXml(tpl.documentXml, vals);
        setGenStatus("Building DOCX file...");
        const blob = await buildDocxBlob(tpl.zip, filledXml);
        setDocxBlob(blob);setDocxBlob2(null);
        const previewText = extractParagraphsFromXml(filledXml).join("\n");
        setDoc(previewText);
      } else {
        let d=tpl.templateText||"";
        Object.entries(vals).forEach(([k,v])=>{d=d.replaceAll(`{{${k}}}`,v||`[${k}]`);});
        setDoc(d);

        const lines = d.split("\n");
        const isLarge = lines.length > SPLIT_LINE_THRESHOLD || d.length > SPLIT_CHAR_THRESHOLD;
        if(isLarge){
          setGenStatus("Large document — splitting into 2 parts...");
          const mid = Math.ceil(lines.length/2);
          const part1 = lines.slice(0,mid).join("\n");
          const part2 = lines.slice(mid).join("\n");
          const [b1,b2] = await Promise.all([
            buildSimpleDocx(tpl.docTitle||"Document", part1, 1),
            buildSimpleDocx(tpl.docTitle||"Document", part2, 2),
          ]);
          setDocxBlob(b1);setDocxBlob2(b2);
        } else {
          setGenStatus("Building DOCX with Telugu font...");
          const blob = await buildSimpleDocx(tpl.docTitle||"Document", d, null);
          setDocxBlob(blob);setDocxBlob2(null);
        }
      }
      setDone(true);
      if(addRecord) addRecord({title:tpl.docTitle||"Document",time:new Date().toISOString(),fields:vals});
    }catch(e){
      alert("Generation failed: "+e.message);
    }
    setGenerating(false);setGenStatus("");
  };

  const baseName = (tpl.docTitle||"document").replace(/\s+/g,"_");

  const dlDOCX=async()=>{
    if(docxBlob){
      downloadBlob(docxBlob, baseName+(docxBlob2?"_Part1":"")+"_filled.docx");
    }
    if(docxBlob2){
      setTimeout(()=>downloadBlob(docxBlob2, baseName+"_Part2_filled.docx"),600);
    }
  };

  const dlTXT=()=>{
    const b=new Blob([doc],{type:"text/plain;charset=utf-8"});
    downloadBlob(b,baseName+"_filled.txt");
  };

  const dlPDF=()=>{
    const title=tpl.docTitle||"Document";
    const w=window.open("","_blank");
    if(!w){alert("Allow popups and try again");return;}
    w.document.write(`<!DOCTYPE html><html><head><title>${title}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu&display=swap');
body{font-family:"Noto Sans Telugu","Gautami","Vemana2000","Times New Roman",serif;font-size:12pt;line-height:2;margin:2cm}
h1{font-size:16pt;text-align:center;font-weight:bold;margin-bottom:18pt}
p{margin:5pt 0}
@media print{body{margin:1.5cm}}
</style></head><body>
<h1>${title}</h1>
${doc.split("\n").map(l=>`<p>${l?l.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"):"&nbsp;"}</p>`).join("\n")}
<script>window.onload=()=>{setTimeout(()=>window.print(),800)}<\/script>
</body></html>`);
    w.document.close();
  };

  return(
    <div className="fadein">
      <Heading title={`✍️ Fill: ${tpl.docTitle||"Document"}`}
        sub={`${fields?.length||0} fields · ${tpl.language||""}${isDocx?" · Smart Template (.docx)":""}`}/>

      {Object.entries(groups).map(([gname,gfields])=>(
        <Card key={gname} style={{marginBottom:14,borderLeft:`4px solid ${GC[gname]||C.indigo}`}}>
          <h4 style={{margin:"0 0 14px",fontSize:13,fontWeight:800,color:GC[gname]||C.indigo}}>{gname}</h4>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12}}>
            {gfields.map(f=>(
              <div key={f.key}>
                <label style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",display:"flex",alignItems:"center",gap:3}}>
                  {TI[f.type]||"📝"} {f.label||f.key.replace(/_/g," ")}
                  {f.required&&<span style={{color:C.rose}}>*</span>}
                </label>
                <input value={vals[f.key]||""} onChange={e=>{setVals(p=>({...p,[f.key]:e.target.value}));setErrs(p=>({...p,[f.key]:""}));}}
                  placeholder={f.sample||""}
                  style={{display:"block",width:"100%",marginTop:4,padding:"8px 11px",
                    border:`2px solid ${errs[f.key]?C.rose:"#E2E8F0"}`,borderRadius:8,fontSize:13,outline:"none",
                    boxSizing:"border-box",color:C.text}}
                  onFocus={e=>{e.target.style.borderColor=TC[f.type]||C.indigo;}}
                  onBlur={e=>{e.target.style.borderColor=errs[f.key]?C.rose:"#E2E8F0";}}/>
                {errs[f.key]&&<span style={{color:C.rose,fontSize:11}}>⚠ {errs[f.key]}</span>}
              </div>
            ))}
          </div>
        </Card>
      ))}

      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
        <Btn color={C.indigo} onClick={generate} disabled={generating} icon="📄">
          {generating?genStatus||"Generating…":isDocx?"Generate DOCX (formatted)":"Generate Document"}
        </Btn>
        <Btn color={C.rose} onClick={async()=>{if(!done){await generate();}dlPDF();}} icon="🖨">Generate PDF</Btn>
        <Btn outline color={C.slate} onClick={()=>{const o={};(fields||[]).forEach(f=>{o[f.key]="";});setVals(o);setDone(false);setDocxBlob(null);setDocxBlob2(null);}}>Clear</Btn>
      </div>

      {done&&(
        <div className="fadein">
          <Card style={{background:C.green+"0A",border:`2px solid ${C.green}40`,marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <span style={{fontSize:32}}>✅</span>
              <div style={{flex:1}}>
                <p style={{fontWeight:800,color:C.green,margin:"0 0 2px",fontSize:15}}>Document Ready!</p>
                <p style={{color:C.muted,fontSize:13,margin:0}}>
                  {baseName}_filled
                  {isDocx&&" · original formatting preserved"}
                  {docxBlob2&&" · Split into Part 1 & Part 2 (large document)"}
                </p>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <Btn small color={C.indigo} onClick={dlDOCX}>
                  ⬇ {docxBlob2?"DOCX (2 files)":"DOCX"}
                </Btn>
                <Btn small color={C.rose} onClick={dlPDF}>🖨 PDF</Btn>
                <Btn small outline color={C.slate} onClick={dlTXT}>TXT</Btn>
              </div>
            </div>
            {docxBlob2&&(
              <div style={{marginTop:10,padding:"8px 12px",background:C.amber+"15",borderRadius:8,fontSize:12,color:C.amber}}>
                📦 Large document split: Part 1 + Part 2 will both download. Open both in Word and combine if needed.
              </div>
            )}
          </Card>
          <Card style={{padding:0,overflow:"hidden"}}>
            <div style={{padding:"9px 16px",background:C.bg,borderBottom:"1px solid #E2E8F0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontWeight:700,fontSize:13}}>📄 Preview {isDocx&&"(text · DOCX has full formatting)"}</span>
              <Btn small outline color={C.slate} onClick={()=>{navigator.clipboard?.writeText(doc);}}>📋 Copy</Btn>
            </div>
            <pre style={{padding:18,margin:0,fontFamily:"'Noto Sans Telugu','Courier New',monospace",fontSize:12,
              lineHeight:2,color:C.text,whiteSpace:"pre-wrap",maxHeight:420,overflowY:"auto"}}>
              {doc}
            </pre>
          </Card>
        </div>
      )}
    </div>
  );
}

// ── Template Editor ──────────────────────────────────────────────────────────
function Editor({template,onUpdate}) {
  const tpl=template||DEFAULT_TPL;
  const isDocx = tpl.mode==="docx";
  const [txt,setTxt]=useState(isDocx ? extractParagraphsFromXml(tpl.documentXml||"").join("\n") : (tpl.templateText||""));
  const [newKey,setNewKey]=useState("");
  const taRef=useRef();

  useEffect(()=>{
    setTxt(isDocx ? extractParagraphsFromXml(tpl.documentXml||"").join("\n") : (tpl.templateText||""));
  },[template]);

  const tags=[...txt.matchAll(/\{\{([A-Z0-9_]+)\}\}/g)].map(m=>m[1]).filter((v,i,a)=>a.indexOf(v)===i);

  const insert=k=>{
    const el=taRef.current;if(!el)return;
    const s=el.selectionStart,e=el.selectionEnd;
    const tag=`{{${k.toUpperCase().replace(/\s+/g,"_")}}}`;
    const n=txt.slice(0,s)+tag+txt.slice(e);
    setTxt(n);
    if(!isDocx && onUpdate)onUpdate({...tpl,templateText:n});
  };

  const save=()=>{
    if(isDocx){alert("For Smart Templates, edit in the Convert review screen. Text editing here doesn't modify .docx formatting.");return;}
    if(onUpdate)onUpdate({...tpl,templateText:txt});
    alert("Template saved!");
  };

  const dl=()=>{
    const b=new Blob([txt],{type:"text/plain"});
    downloadBlob(b,"template.txt");
  };

  return(
    <div className="fadein">
      <Heading title="📝 Template Editor" sub={isDocx
        ? "Smart Template (.docx) — showing extracted text. Original formatting preserved in output."
        : "Edit template text. Use {{FIELD_NAME}} for all variable fields."}/>
      <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
        <div style={{flex:"1 1 300px"}}>
          <Card style={{padding:0,overflow:"hidden",marginBottom:12}}>
            <div style={{padding:"9px 14px",background:C.bg,borderBottom:"1px solid #E2E8F0",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontWeight:700,fontSize:13,flex:1}}>{tpl.docTitle||"Template"}</span>
              {isDocx&&<Badge color={C.gold}>.docx preview</Badge>}
              {!isDocx&&<Btn small color={C.indigo} onClick={save}>💾 Save</Btn>}
              <Btn small outline color={C.slate} onClick={dl}>⬇ Download text</Btn>
            </div>
            <textarea ref={taRef} value={txt} readOnly={isDocx} onChange={e=>{setTxt(e.target.value);if(!isDocx&&onUpdate)onUpdate({...tpl,templateText:e.target.value});}}
              style={{width:"100%",minHeight:400,padding:16,border:"none",fontFamily:"'Noto Sans Telugu','Courier New',monospace",
                fontSize:12,lineHeight:2,resize:"vertical",outline:"none",color:C.text,boxSizing:"border-box",
                background:isDocx?"#FAFBFF":"#fff"}}/>
          </Card>
          {!isDocx&&(
            <Card>
              <p style={{fontWeight:700,fontSize:13,margin:"0 0 8px"}}>➕ Insert Placeholder</p>
              <div style={{display:"flex",gap:8}}>
                <input value={newKey} onChange={e=>setNewKey(e.target.value)} placeholder="e.g. WITNESS_NAME"
                  style={{flex:1,padding:"8px 11px",border:"2px solid #E2E8F0",borderRadius:8,fontSize:13,outline:"none"}}/>
                <Btn small color={C.indigo} onClick={()=>{if(newKey){insert(newKey);setNewKey("");}}}>Insert</Btn>
              </div>
            </Card>
          )}
        </div>
        <div style={{width:240,minWidth:200}}>
          <Card style={{marginBottom:12}}>
            <p style={{fontWeight:700,fontSize:13,margin:"0 0 10px"}}>📋 Fields ({(tpl.fields||tags||[]).length})</p>
            <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:280,overflowY:"auto"}}>
              {(isDocx ? (tpl.fields||[]).map(f=>f.key) : tags).map(t=>(
                <div key={t} style={{display:"flex",alignItems:"center",gap:6}}>
                  <code style={{fontSize:11,color:C.indigo,background:C.indigo+"10",padding:"2px 7px",borderRadius:5,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{`{{${t}}}`}</code>
                  {!isDocx&&<button onClick={()=>insert(t)} style={{background:"none",border:"none",color:C.slate,cursor:"pointer",fontSize:13}}>+</button>}
                </div>
              ))}
              {((isDocx?(tpl.fields||[]):tags).length===0)&&<p style={{color:C.muted,fontSize:12,margin:0}}>No fields yet</p>}
            </div>
          </Card>
          <Card>
            <p style={{fontWeight:700,fontSize:13,margin:"0 0 8px"}}>💡 Tips</p>
            {(isDocx
              ?["Upload .docx in Convert","AI finds hardcoded values","Review & approve new tags","Output keeps fonts/tables/margins","Large docs → chunked AI analysis"]
              :["Use {{CAPS_SNAKE}}","Split: SELLER_NAME, AGE","Dates: {{DEED_DATE}}","Amounts: {{SALE_VALUE}}","IDs: {{AADHAAR_NO}}","Telugu text works natively"]
            ).map((t,i)=>(
              <div key={i} style={{fontSize:11,color:C.muted,padding:"3px 0",borderBottom:"1px solid #F0F4FF"}}>{t}</div>
            ))}
          </Card>
        </div>
      </div>
    </div>
  );
}

// ── AI Chat ──────────────────────────────────────────────────────────────────
function Chat({template,apiKey}) {
  const tpl=template||DEFAULT_TPL;
  const [msgs,setMsgs]=useState([{role:"ai",text:`Hello! I am DocAuto AI Assistant. I can help you with your template "${tpl.docTitle||"document"}". Ask me anything in Telugu, English, Hindi or any language!`}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef();

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const QUICK=["What fields does this template have?","Add a witness section","Split address into parts","How to add more placeholders?","Large document tips?"];

  const send=async(text)=>{
    if(!text.trim())return;
    setMsgs(p=>[...p,{role:"user",text}]);setInput("");setLoading(true);
    try{
      const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
        body:JSON.stringify({
          model:"llama-3.3-70b-versatile",max_tokens:800,
          messages:[
            {role:"system",content:`You are DocAuto AI, a helpful assistant for legal document automation in India. Current template: "${tpl.docTitle||"document"}" with fields: ${(tpl.fields||[]).map(f=>f.key).join(", ")}. Help users with templates, Telugu documents, and document automation. Large docs are auto-split into chunks. Keep answers concise.`},
            ...msgs.map(m=>({role:m.role==="ai"?"assistant":"user",content:m.text})),
            {role:"user",content:text}
          ]
        })
      });
      const d=await r.json();
      setMsgs(p=>[...p,{role:"ai",text:d.choices?.[0]?.message?.content||"Sorry, try again."}]);
    }catch{setMsgs(p=>[...p,{role:"ai",text:"Network error. Please try again."}]);}
    setLoading(false);
  };

  return(
    <div className="fadein">
      <Heading title="🤖 AI Assistant" sub="Ask in any language — Telugu, English, Hindi..."/>
      <Card style={{display:"flex",flexDirection:"column",height:480}}>
        <div style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:10}}>
          {msgs.map((m,i)=>(
            <div key={i} style={{display:"flex",gap:8,flexDirection:m.role==="user"?"row-reverse":"row"}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:m.role==="ai"?C.indigo:C.navy,
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>
                {m.role==="ai"?"🤖":"👤"}
              </div>
              <div style={{background:m.role==="ai"?C.bg:C.indigo,color:m.role==="ai"?C.text:"#fff",
                borderRadius:m.role==="ai"?"4px 14px 14px 14px":"14px 4px 14px 14px",
                padding:"9px 13px",maxWidth:"78%",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
                {m.text}
              </div>
            </div>
          ))}
          {loading&&(
            <div style={{display:"flex",gap:8}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:C.indigo,display:"flex",alignItems:"center",justifyContent:"center"}}>🤖</div>
              <div style={{background:C.bg,borderRadius:"4px 14px 14px 14px",padding:"10px 14px",display:"flex",gap:4}}>
                {[0,1,2].map(i=><span key={i} style={{width:7,height:7,borderRadius:"50%",background:C.indigo,display:"inline-block",animation:`bounce 1s ${i*0.2}s infinite`}}/>)}
              </div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
        <div style={{padding:"6px 12px",borderTop:"1px solid #E2E8F0",display:"flex",gap:6,overflowX:"auto"}}>
          {QUICK.map(q=>(
            <span key={q} onClick={()=>send(q)} style={{whiteSpace:"nowrap",fontSize:11,color:C.indigo,
              background:C.indigo+"12",padding:"3px 9px",borderRadius:20,cursor:"pointer",fontWeight:600}}>{q}</span>
          ))}
        </div>
        <div style={{padding:"10px 14px",borderTop:"1px solid #E2E8F0",display:"flex",gap:8}}>
          <input value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&!loading&&send(input)}
            placeholder="Ask anything..." disabled={loading}
            style={{flex:1,padding:"9px 13px",border:"2px solid #E2E8F0",borderRadius:9,fontSize:13,outline:"none"}}/>
          <Btn onClick={()=>send(input)} disabled={loading||!input.trim()} color={C.indigo}>Send</Btn>
        </div>
      </Card>
    </div>
  );
}

// ── Batch Module ─────────────────────────────────────────────────────────────
function Batch({template}) {
  const tpl=template||DEFAULT_TPL;
  const isDocx = tpl.mode==="docx";
  const fields = tpl.fields||[];
  const cols = fields.slice(0,6).map(f=>f.key);

  const [rows,setRows]=useState(()=>cols.length?[Object.fromEntries(fields.slice(0,6).map(f=>[f.key,f.sample||""]))]:[] );
  const [prog,setProg]=useState(null);
  const [done,setDone]=useState(false);
  const [results,setResults]=useState([]);
  const fileRef=useRef();

  useEffect(()=>{
    const c=fields.slice(0,6).map(f=>f.key);
    setRows(c.length?[Object.fromEntries(fields.slice(0,6).map(f=>[f.key,f.sample||""]))]:[] );
    setDone(false);setProg(null);setResults([]);
  },[template]);

  const onCSV=e=>{
    const f=e.target.files?.[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:"binary"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{defval:""});
      setRows(json);setDone(false);setResults([]);
    };
    rd.readAsBinaryString(f);
  };

  const run=async()=>{
    setProg(0);setDone(false);
    const out=[];
    for(let i=0;i<rows.length;i++){
      const vals={};
      fields.forEach(f=>{vals[f.key]=rows[i][f.key]!==undefined?String(rows[i][f.key]):(f.sample||"");});
      try{
        if(isDocx){
          const filledXml=fillPlaceholdersInXml(tpl.documentXml,vals);
          const blob=await buildDocxBlob(tpl.zip, filledXml);
          out.push({blob, name:`${(tpl.docTitle||"doc").replace(/\s+/g,"_")}_${i+1}.docx`});
        } else {
          let d=tpl.templateText||"";
          Object.entries(vals).forEach(([k,v])=>{d=d.replaceAll(`{{${k}}}`,v||`[${k}]`);});
          const blob = await buildSimpleDocx(tpl.docTitle||"Document", d, null);
          out.push({blob, name:`${(tpl.docTitle||"doc").replace(/\s+/g,"_")}_${i+1}.docx`});
        }
      }catch(e){ out.push({error:e.message}); }
      setProg(i+1);
      await new Promise(r=>setTimeout(r,150));
    }
    setResults(out);setDone(true);
  };

  const downloadZip=async()=>{
    const zip=new JSZip();
    for(const r of results){ if(r.blob) zip.file(r.name, r.blob); }
    const blob=await zip.generateAsync({type:"blob"});
    downloadBlob(blob,(tpl.docTitle||"documents").replace(/\s+/g,"_")+"_batch.zip");
  };

  return(
    <div className="fadein">
      <Heading title="⚡ Batch Generate" sub="Upload Excel/CSV — one row per document. Output is DOCX with Telugu font support."/>
      <Card style={{marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>
          <div style={{flex:1}}>
            <p style={{fontWeight:700,margin:"0 0 2px"}}>📊 Upload CSV / Excel</p>
            <p style={{color:C.muted,fontSize:13,margin:0}}>Columns: {cols.join(", ")||"(no fields)"}</p>
          </div>
          <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}} onChange={onCSV}/>
          <Btn color={C.indigo} onClick={()=>fileRef.current.click()}>⬆ Upload File</Btn>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:C.bg}}>
                {["#",...cols,"Status"].map(h=>(
                  <th key={h} style={{padding:"8px 10px",textAlign:"left",fontWeight:700,color:C.muted,fontSize:11,textTransform:"uppercase"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r,i)=>(
                <tr key={i} style={{borderTop:"1px solid #E2E8F0"}}>
                  <td style={{padding:"8px 10px",color:C.muted}}>{i+1}</td>
                  {cols.map(c=><td key={c} style={{padding:"8px 10px"}}>{r[c]||"—"}</td>)}
                  <td style={{padding:"8px 10px"}}>
                    {done&&results[i]?.blob?<Badge color={C.green}>✅ Done</Badge>
                      :done&&results[i]?.error?<Badge color={C.rose}>⚠ Error</Badge>
                      :prog!==null&&i<prog?<Badge color={C.green}>✅ Done</Badge>
                      :prog!==null&&i===prog?<Badge color={C.amber}>⏳ Processing</Badge>
                      :<Badge color={C.slate}>Pending</Badge>}
                  </td>
                </tr>
              ))}
              {rows.length===0&&(
                <tr><td colSpan={cols.length+2} style={{padding:"14px 10px",color:C.muted,textAlign:"center"}}>No data — upload a CSV/Excel file</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>
      {prog!==null&&!done&&(
        <Card style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontWeight:700}}>Generating…</span>
            <span style={{color:C.muted,fontSize:13}}>{prog}/{rows.length}</span>
          </div>
          <div style={{background:"#E2E8F0",borderRadius:99,height:8}}>
            <div style={{background:C.indigo,width:`${(prog/rows.length)*100}%`,height:8,borderRadius:99,transition:"width .5s"}}/>
          </div>
        </Card>
      )}
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn color={C.indigo} onClick={run} disabled={(prog!==null&&!done)||rows.length===0}>⚡ Generate All ({rows.length})</Btn>
        {done&&<Btn color={C.green} onClick={downloadZip}>⬇ Download ZIP</Btn>}
        {done&&<Btn outline color={C.slate} onClick={()=>{setProg(null);setDone(false);setResults([]);}}>Reset</Btn>}
      </div>
      {done&&(
        <Card style={{marginTop:14,background:C.green+"0A",border:`2px solid ${C.green}30`}}>
          <p style={{fontWeight:800,color:C.green,margin:"0 0 2px"}}>✅ {results.filter(r=>r.blob).length}/{rows.length} documents generated!</p>
          <p style={{color:C.muted,margin:0,fontSize:13}}>Click Download ZIP to save all files. Each DOCX includes Telugu font support.</p>
        </Card>
      )}
    </div>
  );
}

// ── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({records}) {
  const stats=[
    ["Generated",records.length,C.indigo,"📄"],
    ["This Session","✓",C.teal,"📝"],
    ["Languages","Multi",C.gold,"🌐"],
    ["Mode","Smart Template",C.green,"🖋️"],
  ];
  return(
    <div className="fadein">
      <Heading title="📊 Dashboard" sub="Your document automation activity (this session)."/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10,marginBottom:16}}>
        {stats.map(([l,v,c,i])=>(
          <Card key={l} style={{textAlign:"center",padding:14}}>
            <div style={{fontSize:26}}>{i}</div>
            <div style={{fontSize:24,fontWeight:900,color:c,margin:"4px 0"}}>{v}</div>
            <div style={{fontSize:11,color:C.muted}}>{l}</div>
          </Card>
        ))}
      </div>
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <h3 style={{margin:0,fontSize:15,fontWeight:800,color:C.text}}>Generated Documents</h3>
          {records.length>0&&<Btn small outline color={C.slate} onClick={()=>{
            const ws=XLSX.utils.json_to_sheet(records.map(r=>({Title:r.title,Time:r.time,...r.fields})));
            const wb=XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb,ws,"Records");
            const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
            downloadBlob(new Blob([out],{type:"application/octet-stream"}),"docauto_records.xlsx");
          }}>⬇ Export Excel</Btn>}
        </div>
        {records.length===0&&<p style={{color:C.muted,fontSize:13}}>No documents generated yet this session.</p>}
        {[...records].reverse().map((r,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 0",borderBottom:i<records.length-1?"1px solid #F0F4FF":"none"}}>
            <span style={{fontSize:18}}>📄</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{r.title}</div>
              <div style={{color:C.muted,fontSize:12}}>{Object.keys(r.fields).length} fields filled</div>
            </div>
            <span style={{color:C.muted,fontSize:12}}>{new Date(r.time).toLocaleTimeString()}</span>
            <Badge color={C.green}>✓ Ready</Badge>
          </div>
        ))}
      </Card>
    </div>
  );
}

// ── NAV ──────────────────────────────────────────────────────────────────────
const NAV=[
  {id:"convert",icon:"🔄",label:"Convert"},
  {id:"fill",   icon:"✍️",label:"Fill"},
  {id:"editor", icon:"📝",label:"Editor"},
  {id:"chat",   icon:"🤖",label:"AI Chat"},
  {id:"batch",  icon:"⚡",label:"Batch"},
  {id:"dash",   icon:"📊",label:"Dashboard"},
];

// ── ROOT APP ─────────────────────────────────────────────────────────────────
function App() {
  const [keys,setKeys]=useState(null); // {groqKey, geminiKey}
  const [active,setActive]=useState("convert");
  const [sidebar,setSidebar]=useState(true);
  const [template,setTemplate]=useState(null);
  const [records,setRecords]=useState([]);

  if(!keys) return <ApiSetup onDone={k=>setKeys(k)}/>;

  const {groqKey, geminiKey} = keys;
  const addRecord=rec=>setRecords(p=>[...p,rec]);

  const modules={
    convert:()=><Convert groqKey={groqKey} geminiKey={geminiKey} onDone={r=>{setTemplate(r);setActive("fill");}}/>,
    fill:   ()=><Fill template={template} addRecord={addRecord}/>,
    editor: ()=><Editor template={template} onUpdate={setTemplate}/>,
    chat:   ()=><Chat template={template} apiKey={groqKey}/>,
    batch:  ()=><Batch template={template}/>,
    dash:   ()=><Dashboard records={records}/>,
  };
  const Module=modules[active]||modules.convert;

  return(
    <div style={{display:"flex",height:"100vh",background:C.bg,overflow:"hidden"}}>
      <div id="sidebar" style={{width:sidebar?210:56,background:C.navy,display:"flex",flexDirection:"column",
        transition:"width .2s",flexShrink:0,overflow:"hidden"}}>
        <div style={{padding:"18px 14px",borderBottom:"1px solid #ffffff15"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:34,height:34,borderRadius:10,background:`linear-gradient(135deg,${C.indigo},${C.gold})`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>📋</div>
            {sidebar&&<div>
              <div style={{color:"#fff",fontWeight:900,fontSize:14,lineHeight:1}}>DocAuto AI</div>
              <div style={{color:"#6B84F5",fontSize:10}}>Document Automation</div>
            </div>}
          </div>
        </div>
        <nav style={{flex:1,padding:"10px 6px",overflowY:"auto"}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setActive(n.id)} style={{
              width:"100%",display:"flex",alignItems:"center",gap:8,
              padding:"9px 10px",marginBottom:2,borderRadius:9,border:"none",cursor:"pointer",
              background:active===n.id?C.indigo:"transparent",
              color:active===n.id?"#fff":"#8899BB",
              fontWeight:active===n.id?700:500,fontSize:13,transition:"all .15s",textAlign:"left",
            }}>
              <span style={{fontSize:15,flexShrink:0}}>{n.icon}</span>
              {sidebar&&<span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{n.label}</span>}
            </button>
          ))}
        </nav>
        {sidebar&&(
          <div style={{padding:"10px 14px",borderTop:"1px solid #ffffff15"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:C.indigo,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:13,fontWeight:700}}>V</div>
              <div>
                <div style={{color:"#fff",fontSize:12,fontWeight:600}}>Vijaya Kumar</div>
                <div style={{color:"#6B84F5",fontSize:10}}>Professional Plan</div>
              </div>
            </div>
            <button onClick={()=>{setKeys(null);setTemplate(null);setRecords([]);}}
              style={{marginTop:10,background:"none",border:"1px solid #F43F5E40",color:"#F43F5E",
                borderRadius:7,padding:"4px 10px",fontSize:11,cursor:"pointer",width:"100%"}}>
              🔑 Change API Key
            </button>
          </div>
        )}
      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div id="topbar" style={{background:"#fff",borderBottom:"1px solid #E2E8F0",padding:"0 20px",height:52,
          display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <button onClick={()=>setSidebar(p=>!p)}
            style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:C.slate}}>☰</button>
          <span style={{fontWeight:800,fontSize:15,color:C.text,flex:1}}>
            {NAV.find(n=>n.id===active)?.icon} {NAV.find(n=>n.id===active)?.label}
          </span>
          {template&&<Badge color={C.teal}>{template.fields?.length||0} fields</Badge>}
          {template?.mode==="docx"&&<Badge color={C.gold}>Smart Template</Badge>}
        </div>
        <div id="mainContent" style={{flex:1,overflowY:"auto",padding:20}}>
          <Module/>
        </div>
      </div>

      <div id="bottomNav" style={{justifyContent:"space-around",paddingBottom:"env(safe-area-inset-bottom)"}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setActive(n.id)} style={{
            background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",
            gap:2,padding:"6px 8px",cursor:"pointer",
            color:active===n.id?"#4361EE":"#6B84F5",
            borderTop:active===n.id?"2px solid #4361EE":"2px solid transparent",
          }}>
            <span style={{fontSize:18}}>{n.icon}</span>
            <span style={{fontSize:9,fontWeight:active===n.id?700:400}}>{n.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
